name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Compile lf executable
      run: make

    - name: Run primitives test
      run: ./bin/lf -o 31 < ./scripts/primitives.f

