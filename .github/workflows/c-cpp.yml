name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30                 # a passing run takes about 3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Compile lf executable
      run: make

    - name: Python's cryptography package, for the sealblocks.py tests
      run: python3 -c "import cryptography" || (sudo apt-get update && sudo apt-get install -y python3-cryptography)

    - name: Python's pyserial, for running hiltest.py on the simulated board
      run: python3 -c "import serial" || (sudo apt-get update && sudo apt-get install -y python3-serial)

    - name: Run primitives test and unit tests
      shell: bash
      # On a failure, the end of the output also goes into an annotation,
      # which the API serves (the log itself is only a download)
      run: |
        set -o pipefail
        make test 2>&1 | tee test.log && exit 0
        status=$?
        tail -n 60 test.log | python3 -c 'import sys; t = sys.stdin.read(); print("::error title=make test failed::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
        exit $status
